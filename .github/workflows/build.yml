name: Build & Release

on:
  push:
    branches: [master]
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download RTL-SDR DLLs
        shell: pwsh
        run: |
          # Download static build from librtlsdr v0.9.0 (self-contained, no external deps)
          $url = "https://github.com/librtlsdr/librtlsdr/releases/download/v0.9.0/rtlsdr-bin-w64_static.zip"
          Invoke-WebRequest -Uri $url -OutFile rtlsdr.zip
          Expand-Archive rtlsdr.zip -DestinationPath rtlsdr_tmp
          # Static build ships as librtlsdr.dll — rename to rtlsdr.dll for pyrtlsdr
          Copy-Item rtlsdr_tmp/librtlsdr.dll -Destination rtlsdr.dll
          # Create stub files for pthreadVC2/msvcr100 (not needed by static build,
          # but referenced in the PyInstaller spec)
          New-Item -ItemType File -Path pthreadVC2.dll -Force | Out-Null
          New-Item -ItemType File -Path msvcr100.dll -Force | Out-Null
          # Verify
          if (!(Test-Path rtlsdr.dll)) { throw "rtlsdr.dll not found" }
          Remove-Item -Recurse rtlsdr_tmp, rtlsdr.zip

      - name: Build with PyInstaller
        run: pyinstaller accessdr.spec

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          makensis installer\accessdr.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessDR-installer
          path: dist/installer/AccessDR-*-setup.exe

      - name: Attach installer to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/installer/AccessDR-*-setup.exe --clobber
